<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" font-family="Atkinson Hyperlegible, system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0b1d3a"/>
    </marker>
    <marker id="fleche-soleil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9a4a00"/>
    </marker>
  </defs>

  <!-- Ligne 1 : d'où vient l'argent -->
  <rect x="8" y="8" width="160" height="100" rx="10" fill="#fff3dc" stroke="#0b1d3a" stroke-width="2"/>
  <text x="88" y="34" text-anchor="middle" font-weight="700" fill="#0b1d3a">RECETTES</text>
  <text x="88" y="58" text-anchor="middle" fill="#0b1d3a">Impôts</text>
  <text x="88" y="78" text-anchor="middle" fill="#0b1d3a">Cotisations</text>
  <text x="88" y="98" text-anchor="middle" fill="#0b1d3a">Autres revenus</text>

  <rect x="192" y="8" width="160" height="100" rx="10" fill="#ffffff" stroke="#0b1d3a" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="272" y="34" text-anchor="middle" font-weight="700" fill="#0b1d3a">EMPRUNT</text>
  <text x="272" y="58" text-anchor="middle" fill="#0b1d3a">Argent prêté,</text>
  <text x="272" y="78" text-anchor="middle" fill="#0b1d3a">à rendre</text>
  <text x="272" y="98" text-anchor="middle" fill="#0b1d3a">avec intérêts</text>

  <!-- Flèches vers la caisse et vers la dette -->
  <line x1="88" y1="108" x2="88" y2="150" stroke="#0b1d3a" stroke-width="2.5" marker-end="url(#fleche)"/>
  <line x1="222" y1="108" x2="160" y2="150" stroke="#0b1d3a" stroke-width="2.5" marker-end="url(#fleche)"/>
  <line x1="312" y1="108" x2="312" y2="150" stroke="#0b1d3a" stroke-width="2.5" marker-end="url(#fleche)"/>
  <text x="306" y="134" fill="#0b1d3a" font-size="12" text-anchor="end">s'ajoute</text>

  <!-- Ligne 2 : la caisse et la dette -->
  <rect x="8" y="152" width="200" height="74" rx="10" fill="#0b1d3a"/>
  <text x="108" y="178" text-anchor="middle" font-weight="700" fill="#ffffff">CAISSE PUBLIQUE</text>
  <text x="108" y="200" text-anchor="middle" fill="#ffffff" font-size="13">État, Sécurité sociale,</text>
  <text x="108" y="218" text-anchor="middle" fill="#ffffff" font-size="13">collectivités locales</text>

  <rect x="232" y="152" width="120" height="74" rx="10" fill="#ffffff" stroke="#9a4a00" stroke-width="2.5"/>
  <text x="292" y="178" text-anchor="middle" font-weight="700" fill="#9a4a00">DETTE</text>
  <text x="292" y="200" text-anchor="middle" fill="#0b1d3a" font-size="13">tout ce qui reste</text>
  <text x="292" y="218" text-anchor="middle" fill="#0b1d3a" font-size="13">à rembourser</text>

  <!-- Flèches vers les dépenses -->
  <line x1="108" y1="226" x2="108" y2="268" stroke="#0b1d3a" stroke-width="2.5" marker-end="url(#fleche)"/>
  <line x1="292" y1="226" x2="292" y2="268" stroke="#9a4a00" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#fleche-soleil)"/>
  <text x="284" y="252" fill="#9a4a00" font-size="12" text-anchor="end">intérêts à payer</text>

  <!-- Ligne 3 : où va l'argent -->
  <rect x="8" y="270" width="344" height="122" rx="10" fill="#ffffff" stroke="#0b1d3a" stroke-width="2"/>
  <rect x="8" y="270" width="344" height="8" rx="4" fill="#ffa41b"/>
  <text x="180" y="300" text-anchor="middle" font-weight="700" fill="#0b1d3a">DÉPENSES</text>
  <text x="24" y="326" fill="#0b1d3a">• Retraites, familles, chômage</text>
  <text x="24" y="348" fill="#0b1d3a">• Santé, école, sécurité, défense…</text>
  <text x="24" y="370" fill="#9a4a00" font-weight="700">• Intérêts de la dette</text>

  <!-- Le déficit -->
  <rect x="8" y="408" width="344" height="54" rx="10" fill="#fff3dc"/>
  <text x="180" y="430" text-anchor="middle" font-weight="700" fill="#0b1d3a">Déficit = dépenses − recettes</text>
  <text x="180" y="451" text-anchor="middle" fill="#0b1d3a" font-size="13">La part qui manque est payée en empruntant.</text>
</svg>
